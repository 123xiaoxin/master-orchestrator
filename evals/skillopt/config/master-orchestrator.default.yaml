# SkillOpt config template for Master Orchestrator skill training.
# Copy into your local SkillOpt checkout, e.g.:
#   configs/master_orchestrator/default.yaml
#
# Then set env.skill_init to an exported governed baseline:
#   python scripts/master_skill.py export --modules 06 --output .local/skillopt-baseline
#   cp .local/skillopt-baseline/master-prompt.md <SkillOpt>/skillopt/envs/master_orchestrator/skills/initial.md
#
# Absolute split_dir example (adjust to your machine):
#   split_dir: /path/to/master-orchestrator/evals/skillopt/data/master_orchestrator_split
#
# This file does NOT authorize paid runs. Keep batch sizes small for dry runs.

_base_: ../_base_/default.yaml

model:
  reasoning_effort: medium

train:
  num_epochs: 2
  batch_size: 4
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 4
  analyst_workers: 2
  failure_only: false

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  lr_scheduler: cosine
  use_slow_update: true
  slow_update_samples: 4
  use_meta_skill: false

evaluation:
  use_gate: true
  gate_metric: hard
  eval_test: true

env:
  name: master_orchestrator
  skill_init: skillopt/envs/master_orchestrator/skills/initial.md
  split_mode: split_dir
  # Prefer an absolute path to this repo's materialized split:
  split_dir: evals/skillopt/data/master_orchestrator_split
  workers: 2
  max_completion_tokens: 4096
  limit: 0
